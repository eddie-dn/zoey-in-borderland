<?xml version="1.0" encoding="UTF-8"?>
<!-- Zoey in Borderland — logo, trọn một vòng kể 27 giây.
     Mở file này bằng trình duyệt là nó tự chạy. Không cần trang web,
     không cần mạng, không cần phông chữ nào.
     Sinh ra từ chính hoạt hình đang chạy trên trang; muốn dựng lại thì xem
     docs/logo/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="320" height="320"
     class="logo logo--dong" role="img"
     aria-label="Logo Zoey in Borderland đang kể lại quá trình dựng hình">
<style>
svg{color:#7A52B8;background:#FAF6FD}
.logo--dong{--lg-ck:27s}
.lg-vc,.lg-ten path,.lg-noi{
  stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;
}
.lg-vc{stroke-dasharray:130;stroke-dashoffset:130}
.logo:not(.logo--dong) .lg-vc--1{animation:lg-ve .85s cubic-bezier(.65,0,.35,1) .1s forwards}
.logo:not(.logo--dong) .lg-vc--2{animation:lg-ve .85s cubic-bezier(.65,0,.35,1) .8s forwards}
.logo:not(.logo--dong) .lg-man{animation:lg-hien .7s ease-out 1.5s forwards}
.logo:not(.logo--dong) .lg-canh{stroke-opacity:.8;stroke-width:2}
@keyframes lg-ve{to{stroke-dashoffset:0}}
@keyframes lg-hien{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.logo--dong{--lg-ck:27s}
:is(.logo--dong,.logo:not(.logo--dong)) :is(.lg-hoa,.lg-vc,.lg-ten,.lg-noi,
    .lg-man,.lg-bui,.lg-canh-g,.lg-vanh-g){
  transform-box:view-box;transform-origin:50% 50%;
}
.logo--dong .lg-bui circle{transform-box:fill-box;transform-origin:50% 50%}
.logo--dong{--lg-nhip:cubic-bezier(.4,0,.2,1)}
.logo--dong .lg-hoa{animation:lg-hoa   var(--lg-ck) linear infinite}
.logo--dong .lg-vc--1{animation:lg-n1    var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-vc--2{animation:lg-n2    var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-ten{animation:lg-ten   var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-noi{animation:lg-noi   var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-man{animation:lg-man   var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-bui{animation:lg-bui   var(--lg-ck) linear infinite}
.logo--dong .lg-canh-g{animation:lg-canh-g var(--lg-ck) linear infinite}
.logo--dong .lg-vanh-g--ngoai{animation:lg-vanh-n var(--lg-ck) linear infinite}
.logo--dong .lg-vanh-g--giua{animation:lg-vanh-g var(--lg-ck) linear infinite}
.logo--dong .lg-vanh-g--trong{animation:lg-vanh-t var(--lg-ck) linear infinite}
.logo--dong .lg-goc{animation:lg-nhay-goc  var(--lg-ck) var(--lg-nhip) infinite}
.logo--dong .lg-canh{animation:lg-nhay-canh var(--lg-ck) var(--lg-nhip) infinite}
.lg-ten,.lg-noi{opacity:0}
.lg-canh{stroke-width:1.5;stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:10}
.lg-vanh{stroke-width:.9;stroke-opacity:.42;stroke-linecap:round}
.lg-vanh--ngoai{stroke-dasharray:3 6}
.lg-vanh--giua{stroke-dasharray:2 5;stroke-width:.7;stroke-opacity:.28}
.lg-vanh--trong{stroke-dasharray:1.4 3.2}
.lg-man{opacity:0}
.lg-bui circle{opacity:0}
@keyframes lg-hoa{
  0%,8%      {opacity:1;transform:none;filter:blur(0)}

  8.5%,54%   {opacity:1;transform:none;filter:blur(0)}
  58.4%      {opacity:1;transform:rotate(30deg)   scale(1.02);filter:blur(0)}
  65.5%      {opacity:1;transform:rotate(126deg)  scale(1.05)}
  72.7%      {opacity:1;transform:rotate(334deg)  scale(1.09)}
  77%        {opacity:1;transform:rotate(610deg)  scale(1.14);filter:blur(0)}

  80%        {opacity:1;transform:rotate(1050deg) scale(1.20);filter:blur(0)}
  81.5%      {opacity:.36;transform:rotate(1500deg) scale(1.30);filter:blur(.7px)}
  83%        {opacity:0;transform:rotate(1980deg) scale(1.38);filter:blur(1.1px)}
  83.5%      {opacity:0;transform:none;filter:blur(0)}
  85%,100%   {opacity:1;transform:none;filter:blur(0)}
}
@keyframes lg-nhay-goc{
  0%,54%     {opacity:1}
  58%        {opacity:.55}
  63.5%      {opacity:1}
  69%        {opacity:.55}
  74.5%      {opacity:1}
  78%,100%   {opacity:.85}
}
@keyframes lg-nhay-canh{

  0%,8%      {stroke-opacity:.8;stroke-width:2}
  8.5%,54%   {stroke-opacity:.5;stroke-width:1.5}
  58%        {stroke-opacity:1;stroke-width:2.6}
  63.5%      {stroke-opacity:.5;stroke-width:1.5}
  69%        {stroke-opacity:1;stroke-width:2.6}
  74.5%      {stroke-opacity:.5;stroke-width:1.5}
  78%,85%    {stroke-opacity:.8;stroke-width:2.1}
  100%       {stroke-opacity:.8;stroke-width:2}
}
@keyframes lg-canh-g{
  0%,8%      {transform:rotate(0deg)}
  8.5%,48%   {transform:rotate(-45deg)}
  51%,54%    {transform:rotate(0deg)}
  61%        {transform:rotate(9deg)}
  68%        {transform:rotate(-11deg)}
  75.5%      {transform:rotate(15deg)}
  80%,100%   {transform:rotate(0deg)}
}
@keyframes lg-vanh-n{
  0%,54%     {transform:rotate(0deg)}
  66%        {transform:rotate(20deg)}
  76%        {transform:rotate(96deg)}
  83%,100%   {transform:rotate(260deg)}
}
@keyframes lg-vanh-g{
  0%,54%     {transform:rotate(0deg)}
  66%        {transform:rotate(-15deg)}
  76%        {transform:rotate(-74deg)}
  83%,100%   {transform:rotate(-210deg)}
}
@keyframes lg-vanh-t{
  0%,54%     {transform:rotate(0deg)}
  66%        {transform:rotate(32deg)}
  76%        {transform:rotate(160deg)}
  83%,100%   {transform:rotate(430deg)}
}
@keyframes lg-n1{
  0%,8%      {opacity:1;transform:none;stroke-dashoffset:0;stroke-opacity:1}
  8.5%,14%   {opacity:0;transform:rotate(-90deg);stroke-dashoffset:130;stroke-opacity:1}
  14.8%      {opacity:1;transform:rotate(-90deg);stroke-dashoffset:130;stroke-opacity:1}

  21%        {opacity:1;transform:rotate(-90deg);stroke-dashoffset:52;stroke-opacity:1}

  26%,35%    {opacity:1;transform:none;stroke-dashoffset:52;stroke-opacity:1}
  39%        {opacity:1;transform:none;stroke-dashoffset:0;stroke-opacity:1}

  40.5%,46%  {opacity:1;transform:none;stroke-dashoffset:0;stroke-opacity:.3}
  49%,100%   {opacity:1;transform:none;stroke-dashoffset:0;stroke-opacity:1}
}
@keyframes lg-n2{
  0%,8%      {opacity:1;transform:none;stroke-dashoffset:0}
  8.5%,38.5% {opacity:0;transform:none;stroke-dashoffset:130}
  39%        {opacity:1;transform:none;stroke-dashoffset:130}
  42.5%,43%  {opacity:1;transform:none;stroke-dashoffset:52}
  48%,100%   {opacity:1;transform:rotate(180deg);stroke-dashoffset:0}
}
@keyframes lg-ten{
  0%,8%      {opacity:0;transform:scaleX(1)}
  10%,13%    {opacity:.95;transform:scaleX(1)}
  14.5%      {opacity:0;transform:scaleX(.04)}
  15%,100%   {opacity:0;transform:scaleX(1)}
}
@keyframes lg-noi{
  0%,26%     {opacity:0;transform:rotate(-45deg) scale(.45)}
  29%        {opacity:.92;transform:rotate(-45deg) scale(1)}
  32.5%,35%  {opacity:.92;transform:rotate(0deg) scale(1)}
  38.5%      {opacity:0;transform:rotate(0deg) scale(1)}
  39%,100%   {opacity:0;transform:rotate(-45deg) scale(.45)}
}
@keyframes lg-man{
  0%,8%      {opacity:1;transform:scale(1)}
  8.5%,48%   {opacity:0;transform:scale(1)}

  51%,80%    {opacity:1;transform:scale(1)}
  81.5%      {opacity:.35;transform:scale(1.06)}
  83%        {opacity:0;transform:scale(1.1)}
  83.5%      {opacity:0;transform:scale(1)}
  85%,100%   {opacity:1;transform:scale(1)}
}
@keyframes lg-bui{
  0%,79.8%   {opacity:0}
  79.9%,84.5%{opacity:1}
  84.7%,100% {opacity:0}
}
.logo--dong .lg-bui circle{
  animation:lg-hat var(--lg-ck) cubic-bezier(.12,.62,.28,1) infinite;
  animation-delay:calc(var(--bt) * var(--lg-ck) * 0.010);
}
@keyframes lg-hat{
  0%,79.9%   {opacity:0;transform:translate(0,0) scale(1)}
  81%        {opacity:.95;transform:translate(0,0) scale(1)}
  83%        {opacity:.72}
  84.4%      {opacity:0;transform:translate(var(--bx),var(--by)) scale(.35)}
  84.5%,100% {opacity:0;transform:translate(0,0) scale(1)}
}
.logo--dong{--lg-ck:27s}
</style>
