<!DOCTYPE html>
<html lang="{{lang}}" {{htmlAttr}}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta name="theme-color" content="#FAF6FD">
<link rel="canonical" href="{{canonical}}">
{{robots}}
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteTitle}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
{{ogThem}}
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}/feed.xml">
<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">

<!-- ĐẶT THEME TRƯỚC KHI VẼ KHUNG HÌNH ĐẦU TIÊN.
     Phải viết thẳng vào đây, không được tách ra file ngoài: file ngoài tải xong
     thì trình duyệt đã vẽ xong nền sáng rồi, người đọc thấy trang loé trắng một
     nhịp mới tối lại. Đoạn này cố tình để trần, không bọc hàm, cho chạy sớm nhất. -->
<script>
(function(){try{
  var h=document.documentElement;
  /* Ba theme, và MÀU THANH TRẠNG THÁI của mỗi cái. Bảng này lặp lại ở
     src/js/theme.js — cố ý, vì đoạn này phải chạy trước khi có file ngoài
     nào kịp tải. Sửa màu nền thì sửa cả hai chỗ. */
  var MAU={light:'#FAF6FD',dark:'#120C22',calm:'#E9F1FA'};
  var t=localStorage.getItem('zib-theme');
  /* Tra bảng chứ không liệt kê `t==='dark'||t==='light'||...`: thêm theme là
     thêm một dòng ở MAU, không phải đi sửa thêm một câu điều kiện ở đây. */
  if(!MAU[t]){
    /* Chưa chọn gì: trang nào khai data-ep thì theo trang (trang chủ ép sáng
       để màn hero luôn ra đúng tông đã thiết kế), còn lại theo hệ điều hành. */
    t=h.getAttribute('data-ep')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  }
  /* Đã tự chọn thì theo họ, kể cả trên trang có ép theme. Ép đè lên lựa chọn
     của người dùng là kiểu trang web cãi lại chính người dùng. */
  h.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').content=MAU[t]||MAU.light;
  /* ICON CỦA TAB CŨNG THEO THEME, và phải đặt Ở ĐÂY.
     Thẻ <link rel=icon> bên trên là HTML tĩnh, nên trình duyệt bắt đầu tải
     favicon.svg ngay khi đọc tới nó. Để việc đổi cho src/js/theme.js làm thì
     người đọc theme calm thấy icon tím loé một nhịp rồi mới sang xanh.

     Chỉ `calm` có bản riêng — vì sao chỉ nó, xem chú thích ở FAVICON trong
     tools/build.mjs. Bảng đầy đủ nằm ở src/js/theme.js; ở đây cố ý chỉ một
     dòng, vì đoạn này phải chạy trước khi có file ngoài nào kịp tải.

     Suy ra tên file từ chính href đang có, không dán lại đường dẫn: trang chạy
     dưới thư mục con thì {{base}} khác rỗng, mà dán tay là sớm muộn lệch. */
  if(t==='calm'){var ic=document.querySelector('link[rel=icon]');
    if(ic)ic.href=ic.href.replace('favicon.svg','favicon-calm.svg');}
}catch(e){}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{base}}/assets/style.css">
{{headExtra}}
</head>
<body>
<a class="sr-only focusable" href="#noi-dung">{{skipToMain}}</a>

<div class="shell"{{shellAttr}}>
<header class="site-head">
  <div class="container">
    <!-- Tên blog nằm trong aria-label chứ không nằm ở chữ hiện ra: ở trang chủ
         phần chữ bị ẩn hẳn, và một liên kết chỉ có hình thì trình đọc màn hình
         không có gì để đọc. Dòng tagline đã bỏ — logo nói thay nó. -->
    <a class="brand{{lopBrand}}" href="{{base}}/" aria-label="{{siteTitle}}">
      {{logo}}<b aria-hidden="true">{{siteTitle}}</b>
    </a>
    <nav class="nav" aria-label="Main">
      <!-- Bốn mục điều hướng bọc trong một lớp: ở khổ rộng lớp này tàng hình
           (`display:contents`) nên lưới thanh đầu trang không biết nó có mặt;
           ở khổ hẹp nó thành tấm menu thả xuống dưới nút ☰.

           TÌM KIẾM ĐI THEO HAI ĐƯỜNG, và chỉ hiện một đường mỗi lúc:
             ≥640px  một nút hình kính lúp trên thanh (`{{napTimKiem}}` dưới đây)
             <640px  một DÒNG CHỮ trong tấm menu này

           Ở khổ điện thoại, thanh đầu trang chỉ còn chừng 180px cho ba cái nút
           hình đứng cạnh tên blog. Bỏ bớt một cái là tên blog thở ra được, mà
           tìm kiếm thì chẳng mất đi đâu — nó xuống nằm cùng chỗ với bốn mục
           điều hướng kia, tức là đúng chỗ người ta mở ra để đi tới một trang. -->
      <div class="nav-menu">{{nav}}{{timTrongMenu}}
      </div>
      {{napTimKiem}}
      <!-- BA nhãn đi kèm dưới dạng data-*: theme.js xoay vòng giữa chúng mỗi
           lần bấm, nên nó phải có SẴN CẢ BA chứ không tự chế chữ. Gõ cứng
           trong theme.js thì bảng NHAN sửa xong không có tác dụng.

           Nhãn ban đầu để "sang Galaxy" vì theme mặc định là Sakura; theme.js
           sửa lại ngay lúc nạp nếu người đọc đang ở theme khác. -->
      <button class="ico-btn tip theme-btn" type="button"
              aria-label="{{toDark}}" data-tip="{{toDark}}"
              data-nhan-sang="{{toLight}}" data-nhan-toi="{{toDark}}"
              data-nhan-tinh="{{toCalm}}">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 1 1 9.6 3.5a6.9 6.9 0 0 0 10.9 10.9Z"/></svg>
        <!-- Giọt nước rơi xuống, cộng một gợn sóng dưới chân. Chỉ mỗi giọt thì
             ở cỡ 24px nó đọc ra là một cái lá; có gợn thì đọc ra là NƯỚC. -->
        <svg class="i-giot" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c3.1 3.8 4.9 6.5 4.9 8.7a4.9 4.9 0 0 1-9.8 0c0-2.2 1.8-4.9 4.9-8.7Z"/><path d="M4.2 19.4c1.5 0 1.5 1.5 3 1.5s1.5-1.5 3-1.5 1.5 1.5 3 1.5 1.5-1.5 3-1.5 1.5 1.5 3 1.5"/></svg>
      </button>
      <!-- NÚT ☰ ĐỨNG CUỐI HÀNG, sát mép phải nhất.
           Nó là thứ chứa mọi đường đi còn lại, nên nó phải nằm ở góc — góc là
           chỗ ngón cái với tới dễ nhất khi cầm điện thoại một tay, và là chỗ
           mọi ứng dụng khác cũng để cái menu của chúng. Trước bản này nó đứng
           TRƯỚC nút theme, tức là cái nút quan trọng nhất trên điện thoại lại
           nằm khuất vào trong.

           Đổi chỗ trong HTML chứ không bằng `order` của CSS: thứ tự Tab của
           bàn phím đi theo HTML, nên đảo bằng CSS là mắt thấy một đằng, phím
           Tab chạy một nẻo. -->
      <button class="ico-btn nav-nut" type="button"
              aria-expanded="false" aria-controls="nav-menu"
              aria-label="{{menuLabel}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="noi-dung">
{{content}}
</main>

<footer class="site-foot">
  <div class="container">
    <!-- MỘT HÀNG, HAI ĐẦU — không phải hai hàng chồng nhau.
         Trước đây tem bên phải xếp DỌC: ký tên trên, phiên bản dưới. Hai dòng
         ấy làm chân trang cao thêm hẳn một hàng để nói hai mẩu chữ ngắn, mà
         chúng cũng chẳng dính nhau — một cái là chủ sở hữu, một cái là bản
         dựng. Nay ký tên về đứng ĐẦU hàng trái, ngay trước mấy đường đi: nó là
         chủ của mấy đường ấy, đứng trước là đúng thứ tự đọc. Phiên bản ở lại
         mép phải một mình, và cả chân trang gói gọn trong một hàng. -->
    <div class="foot-trai">
      <span class="stamp-ky">© {{year}} {{author}}</span>
      <div class="foot-links">
        {{footLinks}}
      </div>
    </div>
    <!-- Dòng phiên bản là cửa vào sổ lịch sử: bấm 5 nhịp thì mở. Cửa là chính
         dòng chữ, không phải một cái nút — xem đầu src/js/so-tay.js. `.stamp`
         giữ nguyên tên lớp dù nay chỉ còn một dòng: components.css đang nhờ nó
         tắt bôi đen chữ, và so-tay.js thì tìm theo [data-so-tay] nên không
         dính gì tới chỗ này. -->
    <div class="stamp">
      <span class="stamp-ban" data-so-tay tabindex="0" role="button"
            aria-label="Last updated {{buildDate}}, {{version}}">Last updated {{buildDate}} · {{version}}</span>
    </div>
  </div>
</footer>
</div>

<script src="{{base}}/assets/theme.js" defer></script>
<script src="{{base}}/assets/so-tay.js" defer></script>
{{scripts}}
</body>
</html>
