<!DOCTYPE html>
<html lang="{{lang}}" {{htmlAttr}}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta name="theme-color" content="#FAF6FD">
<link rel="canonical" href="{{canonical}}">
{{robots}}
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteTitle}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}/feed.xml">
<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">

<!-- ĐẶT THEME TRƯỚC KHI VẼ KHUNG HÌNH ĐẦU TIÊN.
     Phải viết thẳng vào đây, không được tách ra file ngoài: file ngoài tải xong
     thì trình duyệt đã vẽ xong nền sáng rồi, người đọc thấy trang loé trắng một
     nhịp mới tối lại. Đoạn này cố tình để trần, không bọc hàm, cho chạy sớm nhất. -->
<script>
(function(){try{
  var h=document.documentElement;
  /* Ba theme, và MÀU THANH TRẠNG THÁI của mỗi cái. Bảng này lặp lại ở
     src/js/theme.js — cố ý, vì đoạn này phải chạy trước khi có file ngoài
     nào kịp tải. Sửa màu nền thì sửa cả hai chỗ. */
  var MAU={light:'#FAF6FD',dark:'#120C22',calm:'#F1F7FB'};
  var t=localStorage.getItem('zib-theme');
  /* Tra bảng chứ không liệt kê `t==='dark'||t==='light'||...`: thêm theme là
     thêm một dòng ở MAU, không phải đi sửa thêm một câu điều kiện ở đây. */
  if(!MAU[t]){
    /* Chưa chọn gì: trang nào khai data-ep thì theo trang (trang chủ ép sáng
       để màn hero luôn ra đúng tông đã thiết kế), còn lại theo hệ điều hành. */
    t=h.getAttribute('data-ep')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  }
  /* Đã tự chọn thì theo họ, kể cả trên trang có ép theme. Ép đè lên lựa chọn
     của người dùng là kiểu trang web cãi lại chính người dùng. */
  h.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').content=MAU[t]||MAU.light;
}catch(e){}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{base}}/assets/style.css">
{{headExtra}}
</head>
<body>
<a class="sr-only focusable" href="#noi-dung">{{skipToMain}}</a>

<div class="shell">
<header class="site-head">
  <div class="container">
    <!-- Tên blog nằm trong aria-label chứ không nằm ở chữ hiện ra: ở trang chủ
         phần chữ bị ẩn hẳn, và một liên kết chỉ có hình thì trình đọc màn hình
         không có gì để đọc. Dòng tagline đã bỏ — logo nói thay nó. -->
    <a class="brand{{lopBrand}}" href="{{base}}/" aria-label="{{siteTitle}}">
      {{logo}}<b aria-hidden="true">{{siteTitle}}</b>
    </a>
    <nav class="nav" aria-label="Main">
      {{nav}}
      {{napTimKiem}}
      <!-- BA nhãn đi kèm dưới dạng data-*: theme.js xoay vòng giữa chúng mỗi
           lần bấm, nên nó phải có SẴN CẢ BA chứ không tự chế chữ. Gõ cứng
           trong theme.js thì bảng NHAN sửa xong không có tác dụng.

           Nhãn ban đầu để "sang Galaxy" vì theme mặc định là Sakura; theme.js
           sửa lại ngay lúc nạp nếu người đọc đang ở theme khác. -->
      <button class="ico-btn tip theme-btn" type="button"
              aria-label="{{toDark}}" data-tip="{{toDark}}"
              data-nhan-sang="{{toLight}}" data-nhan-toi="{{toDark}}"
              data-nhan-tinh="{{toCalm}}">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 1 1 9.6 3.5a6.9 6.9 0 0 0 10.9 10.9Z"/></svg>
        <!-- Giọt nước rơi xuống, cộng một gợn sóng dưới chân. Chỉ mỗi giọt thì
             ở cỡ 24px nó đọc ra là một cái lá; có gợn thì đọc ra là NƯỚC. -->
        <svg class="i-giot" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c3.1 3.8 4.9 6.5 4.9 8.7a4.9 4.9 0 0 1-9.8 0c0-2.2 1.8-4.9 4.9-8.7Z"/><path d="M4.2 19.4c1.5 0 1.5 1.5 3 1.5s1.5-1.5 3-1.5 1.5 1.5 3 1.5 1.5-1.5 3-1.5 1.5 1.5 3 1.5"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="noi-dung">
{{content}}
</main>

<footer class="site-foot">
  <div class="container">
    <!-- Hàng này chỉ còn là ĐƯỜNG ĐI. Dòng "© năm tác giả" đã dời sang tem
         bên phải: hai dấu ký tên ở hai đầu cùng một chân trang thì cái nào
         cũng yếu đi, mà bên phải vốn đã là chỗ của chữ ký rồi. -->
    <div class="foot-links">
      {{footLinks}}
    </div>
    <!-- Tem hai dòng: ký tên TRÊN, phiên bản DƯỚI — đúng §4 của DESIGN-SYSTEM.
         Dòng DƯỚI là cửa vào sổ lịch sử: bấm 5 nhịp thì mở. Cửa là chính dòng
         chữ, không phải một cái nút — xem đầu src/js/so-tay.js. -->
    <div class="stamp">
      <span class="stamp-ky">© {{year}} {{author}}</span>
      <span class="stamp-ban" data-so-tay tabindex="0" role="button"
            aria-label="Last updated {{buildDate}}, {{version}}">Last updated {{buildDate}} · {{version}}</span>
    </div>
  </div>
</footer>
</div>

<script src="{{base}}/assets/theme.js" defer></script>
<script type="application/json" id="so-tay-data">{{soTay}}</script>
<script src="{{base}}/assets/so-tay.js" defer></script>
{{scripts}}
</body>
</html>
