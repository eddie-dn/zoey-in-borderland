<div class="read-bar" aria-hidden="true"></div>

<!-- Bốn khối này đều là CON TRỰC TIẾP của .post-layout, không lồng vào nhau.
     Nhờ vậy lưới xếp được chúng độc lập ở mỗi khổ màn:

       màn hẹp   → một cột, đúng thứ tự đọc:
                   đầu bài → mục lục (gập) → thân bài → chân bài
       ≥1080px   → đầu/thân/chân xếp dọc ở cột trái,
                   mục lục dính ở cột phải, ngang tầm thân bài

     Bản trước để đầu bài NẰM TRONG <article>, nên mục lục — vốn là anh em của
     <article> — không chen vào giữa đầu bài và thân bài được, và ở màn hẹp nó
     rơi xuống tận cuối trang, tức là sau khi đọc xong mới thấy mục lục. -->

<div class="post-layout khung-{{khung}}">

  <header class="post-head">
    <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>

    <h1>{{title}}</h1>

    <!-- MỘT HÀNG duy nhất dưới tiêu đề: ngày đăng · mốc cập nhật · lượt xem,
         rồi tới cụm tim · chia sẻ · bình luận.

         Trước bản này chúng là HAI hàng: hàng meta ở trên, hàng nút (có cả
         nhãn "LEAVE A NOTE") ở dưới. Hai hàng cho hai thứ vốn nói về cùng một
         bài, mà lại lặp cả nội dung — trái tim đếm số ở hàng trên, trái tim
         bấm được ở hàng dưới. Gộp lại thì mất một hàng, mất một nhãn, và mỗi
         con số chỉ còn đúng một chỗ để xuất hiện.

         "Phút đọc" đã bỏ từ lâu: nó là con số MÁY ĐOÁN từ số chữ, còn lượt xem
         là con số THẬT. Xem docs/DESIGN-SYSTEM.md §18. -->
    <div class="meta-row">
      <time datetime="{{dateISO}}">{{dateText}}</time>
      {{mocBlock}}
      {{xemBlock}}
      {{draftBadge}}
      {{cumDau}}
    </div>

    {{summaryBlock}}
  </header>

  <!-- Băng ảnh của khung C. Rỗng ở khung A và B, nên nó không chiếm ô lưới nào
       (CSS đặt `display:none` cho khối rỗng). -->
  {{bangAnh}}

  {{toc}}

  <article class="prose"{{copyGuard}} itemscope itemtype="https://schema.org/BlogPosting">
    {{cover}}
    {{body}}
  </article>

  <!-- ── THỨ TỰ CUỐI BÀI ──
       tag → khung bình luận → gợi ý đọc tiếp.

       Khung bình luận đứng NGAY DƯỚI hàng tag, không phải sau danh sách gợi
       ý. Nó mặc định đóng, nên ở trạng thái thường nó không chiếm gì cả — chỉ
       là một chỗ trống chờ sẵn. Cái quyết định thứ tự là lúc nó MỞ: người đọc
       bấm nút bình luận ở đầu bài, và thứ mở ra phải nằm ở chỗ đoán được. Ngay
       sau tag là chỗ ấy — cùng chỗ mọi trang ảnh vẫn để phần bình luận.

       Đặt nó sau danh sách gợi ý thì mỗi lần mở là phải cuộn qua trọn danh
       sách mới thấy ô viết, và danh sách thì bị đẩy đi đâu mất giữa chừng.

       Gợi ý đọc tiếp ở lại cuối cùng: nó là đường ĐI KHỎI bài, nên nó đi sau
       mọi lý do để ở lại. (Khung A đưa khối này lên cột bên — xem build.mjs.)

       Ba con số vẫn ở hàng meta ĐẦU bài, trên chính các nút của chúng. -->
  <footer class="post-foot">
    {{tagBlock}}
    {{binhLuan}}
    {{readNext}}
  </footer>
</div>
