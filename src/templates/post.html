<div class="read-bar" aria-hidden="true"></div>

<!-- Bốn khối này đều là CON TRỰC TIẾP của .post-layout, không lồng vào nhau.
     Nhờ vậy lưới xếp được chúng độc lập ở mỗi khổ màn:

       màn hẹp   → một cột, đúng thứ tự đọc:
                   đầu bài → mục lục (gập) → thân bài → chân bài
       ≥1080px   → đầu/thân/chân xếp dọc ở cột trái,
                   mục lục dính ở cột phải, ngang tầm thân bài

     Bản trước để đầu bài NẰM TRONG <article>, nên mục lục — vốn là anh em của
     <article> — không chen vào giữa đầu bài và thân bài được, và ở màn hẹp nó
     rơi xuống tận cuối trang, tức là sau khi đọc xong mới thấy mục lục. -->

<div class="post-layout khung-{{khung}}">

  <header class="post-head">
    <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>

    <h1>{{title}}</h1>

    <!-- Hàng meta bám ngay dưới tiêu đề: ngày đăng gốc, mốc cập nhật gần nhất,
         và lượt xem. Trước đây có "phút đọc" — bỏ đi, vì nó là con số MÁY ĐOÁN
         từ số chữ, còn lượt xem là con số THẬT. Xem docs/DESIGN-SYSTEM.md §18. -->
    <div class="meta-row">
      <time datetime="{{dateISO}}">{{dateText}}</time>
      {{mocBlock}}
      {{xemBlock}}
      {{draftBadge}}
    </div>

    {{summaryBlock}}
  </header>

  <!-- Băng ảnh của khung C. Rỗng ở khung A và B, nên nó không chiếm ô lưới nào
       (CSS đặt `display:none` cho khối rỗng). -->
  {{bangAnh}}

  {{toc}}

  <article class="prose"{{copyGuard}} itemscope itemtype="https://schema.org/BlogPosting">
    {{cover}}
    {{body}}
  </article>

  <footer class="post-foot">
    {{tagBlock}}
    {{binhLuan}}
    {{readNext}}
  </footer>
</div>
